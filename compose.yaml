services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventory}
      POSTGRES_USER: ${POSTGRES_USER:-inventory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory-local-only}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 5s, retries: 10}
    volumes: [postgres-data:/var/lib/postgresql/data]
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-inventory}
      DATABASE_USERNAME: ${POSTGRES_USER:-inventory}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-inventory-local-only}
    depends_on: {db: {condition: service_healthy}}
volumes: {postgres-data: {}}
